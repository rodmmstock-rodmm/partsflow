name: Apply requested dashboard and order UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-order-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch requested UI/order behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing anchor: {label} in {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('patched', label)

          # 1) Dashboard desktop: requester remains typeable by employee name;
          # machine is typeable and displays/resolves by machine code only.
          replace_once('frontend/src/pages/Dashboard.jsx',
            'const shown = kind === "employee" ? `${item.name}` : kind === "machine" ? `${item.name}` : `${item.code} · ${item.name}`;',
            'const shown = kind === "employee" ? `${item.name}` : kind === "machine" ? `${item.code}` : `${item.code} · ${item.name}`;',
            'dashboard machine resolver uses code')
          replace_once('frontend/src/pages/Dashboard.jsx',
            '{(options.machines || []).map((item) => <option key={item.id} value={item.name} />)}',
            '{(options.machines || []).map((item) => <option key={item.id} value={item.code} />)}',
            'dashboard machine datalist code only')

          # Remove Vendor Lead Time input from Dashboard part form.
          replace_once('frontend/src/pages/Dashboard.jsx', '''          <label className="field">\n            <span>Vendor Lead Time</span>\n            <div className="input-suffix">\n              <input\n                type="number"\n                min="0"\n                value={form.vendor_lead_time_days}\n                onChange={(e) => set("vendor_lead_time_days", e.target.value)}\n              />\n              <b>DAY</b>\n            </div>\n          </label>\n''', '', 'remove dashboard part lead time field')

          # 1) Mobile stock form: use typeable datalists; save IDs after exact resolution.
          p=Path('frontend/src/mobile/MobileCommon.jsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('const [requesterId,setRequesterId]=useState("");\n  const [machineId,setMachineId]=useState("");',
                      'const [requesterText,setRequesterText]=useState("");\n  const [machineText,setMachineText]=useState("");',1)
          anchor='''  const after=useMemo(()=>{\n    const stock=Number(part.stock_qty||0), amount=Number(qty||0);\n    return issue?stock-amount:stock+amount;\n  },[part.stock_qty,qty,issue]);\n'''
          if anchor not in s: raise SystemExit('missing MobileCommon after anchor')
          helper=anchor+'''\n  function resolveOption(list,text,kind){\n    const target=String(text||"").trim().toLowerCase();\n    return (list||[]).find(x=>{\n      const shown=kind==="employee"?String(x.name||""):String(x.code||"");\n      const alt=kind==="employee"?String(x.employee_code||""):String(x.name||"");\n      return shown.toLowerCase()===target||alt.toLowerCase()===target;\n    });\n  }\n'''
          s=s.replace(anchor,helper,1)
          old='''    if(issue&&!requesterId){setError("กรุณาเลือกผู้เบิก");return;}\n    if(issue&&!machineId){setError("กรุณาเลือกเครื่องจักร");return;}\n    setBusy(true);\n    try{\n      const payload={part_id:part.id,quantity:amount,note};\n      if(issue){payload.requester_id=requesterId;payload.machine_id=machineId;}\n'''
          new='''    const selectedEmployee=issue?resolveOption(options.employees,requesterText,"employee"):null;\n    const selectedMachine=issue?resolveOption(options.machines,machineText,"machine"):null;\n    if(issue&&!selectedEmployee){setError("กรุณาเลือกผู้เบิกจากรายการ");return;}\n    if(issue&&!selectedMachine){setError("กรุณาเลือกเครื่องจักรจากรายการ");return;}\n    setBusy(true);\n    try{\n      const payload={part_id:part.id,quantity:amount,note};\n      if(issue){payload.requester_id=selectedEmployee.id;payload.machine_id=selectedMachine.id;}\n'''
          if old not in s: raise SystemExit('missing MobileCommon submit block')
          s=s.replace(old,new,1)
          old='''        <label className="field"><span>ผู้เบิก *</span><select value={requesterId} onChange={e=>setRequesterId(e.target.value)} disabled={loading}><option value="">เลือกผู้เบิก</option>{(options.employees||[]).filter(x=>x.active!==false).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></label>\n        <label className="field"><span>เครื่องจักร *</span><select value={machineId} onChange={e=>setMachineId(e.target.value)} disabled={loading}><option value="">เลือกเครื่องจักร</option>{(options.machines||[]).filter(x=>x.active!==false).map(x=><option key={x.id} value={x.id}>{x.code} · {x.name}</option>)}</select></label>\n'''
          new='''        <label className="field"><span>ผู้เบิก *</span><input list="m-stock-employees" value={requesterText} onChange={e=>setRequesterText(e.target.value)} disabled={loading} placeholder="พิมพ์ชื่อผู้เบิก..."/><datalist id="m-stock-employees">{(options.employees||[]).filter(x=>x.active!==false).map(x=><option key={x.id} value={x.name}/>)}</datalist></label>\n        <label className="field"><span>เครื่องจักร *</span><input list="m-stock-machines" value={machineText} onChange={e=>setMachineText(e.target.value)} disabled={loading} placeholder="พิมพ์ Machine Code..."/><datalist id="m-stock-machines">{(options.machines||[]).filter(x=>x.active!==false).map(x=><option key={x.id} value={x.code}/>)}</datalist></label>\n'''
          if old not in s: raise SystemExit('missing MobileCommon select block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8'); print('patched mobile stock typeable employee/machine')

          # 2) Part detail: remove all lead-time displays, including supplier lead time column.
          p=Path('frontend/src/components/PartDetailModal.jsx'); s=p.read_text(encoding='utf-8')
          for line in [
              '          <Info label="Vendor Lead Time">{fmt(p.vendor_lead_time_days)} วัน</Info>\n',
              '          <Info label="Purchasing Lead Time">{fmt(p.purchasing_lead_time_days)} วัน</Info>\n',
              '          <Info label="Total Lead Time">{fmt(p.total_lead_time_days)} วัน</Info>\n',
          ]:
              if line not in s: raise SystemExit('missing lead-time detail line')
              s=s.replace(line,'',1)
          old='<div className="detail-table-wrap"><table><thead><tr><th>Vendor</th><th>Supplier Part No.</th><th>ราคา</th><th>Lead Time</th><th>MOQ</th><th>Preferred</th></tr></thead><tbody>\n            {p.suppliers.map(x => <tr key={x.id}><td><b>{x.code}</b> · {x.name}</td><td>{x.supplier_part_no || "-"}</td><td>{x.currency} {money(x.unit_price)}</td><td>{fmt(x.lead_time_days)} วัน</td><td>{fmt(x.minimum_order_qty)}</td><td>{x.is_preferred ? "✓" : "-"}</td></tr>)}'
          new='<div className="detail-table-wrap"><table><thead><tr><th>Vendor</th><th>Supplier Part No.</th><th>ราคา</th><th>MOQ</th><th>Preferred</th></tr></thead><tbody>\n            {p.suppliers.map(x => <tr key={x.id}><td><b>{x.code}</b> · {x.name}</td><td>{x.supplier_part_no || "-"}</td><td>{x.currency} {money(x.unit_price)}</td><td>{fmt(x.minimum_order_qty)}</td><td>{x.is_preferred ? "✓" : "-"}</td></tr>)}'
          if old not in s: raise SystemExit('missing supplier lead time table')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); print('removed all part-detail lead time UI')

          # 3) Mobile Active Order urgency filter.
          p=Path('frontend/src/mobile/MobileOrders.jsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('[q,setQ]=useState(""),[status,setStatus]=useState(""),[job,setJob]=useState("")',
                      '[q,setQ]=useState(""),[status,setStatus]=useState(""),[job,setJob]=useState(""),[urgency,setUrgency]=useState("all")',1)
          s=s.replace('new URLSearchParams({view:tab,q:"",urgency:"all",job,status})',
                      'new URLSearchParams({view:tab,q:"",urgency,job,status})',1)
          s=s.replace('useEffect(()=>{load()},[tab,status,job]);','useEffect(()=>{load()},[tab,status,job,urgency]);',1)
          s=s.replace('setStatus("")}}>{l}</button>', 'setStatus("");setUrgency("all")}}>{l}</button>',1)
          old='{tab==="normal"&&<div className="m-filter-row m-filter-row-wide"><select value={job} onChange={e=>setJob(e.target.value)}><option value="">ทุก JOB</option><option>REPAIR</option><option>MODIFY</option><option>AUTOMATION</option><option>PM</option></select><select value={status} onChange={e=>setStatus(e.target.value)}><option value="">ทุกสถานะ</option><option>New Order</option><option>Wait Quotation</option><option>Wait Issue P/R</option><option>Wait for Item</option></select></div>}'
          new='{tab==="normal"&&<div className="m-filter-row m-filter-row-wide"><select value={urgency} onChange={e=>setUrgency(e.target.value)}><option value="all">สถานะงานด่วน: ทั้งหมด</option><option value="urgent">งานด่วน</option><option value="urgent_pending">งานด่วน + ค้าง DATA</option><option value="pending">งานค้าง DATA</option><option value="normal">รายการทั่วไป</option></select><select value={job} onChange={e=>setJob(e.target.value)}><option value="">ทุก JOB</option><option>REPAIR</option><option>MODIFY</option><option>AUTOMATION</option><option>PM</option></select><select value={status} onChange={e=>setStatus(e.target.value)}><option value="">ทุกสถานะ</option><option>New Order</option><option>Wait Quotation</option><option>Wait Issue P/R</option><option>Wait for Item</option></select></div>}'
          if old not in s: raise SystemExit('missing mobile order filter block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8'); print('added mobile urgency filter')

          # 4) Desktop Completed/Cancelled grouped by year/month like History.
          p=Path('frontend/src/pages/Orders.jsx'); s=p.read_text(encoding='utf-8')
          urgent='''const URGENT = [\n  "งานด่วนเครื่องหยุด",\n  "งานด่วนเครื่องไม่หยุด",\n  "งานด่วน + ค้าง DATA",\n];\n'''
          if urgent not in s: raise SystemExit('missing URGENT const')
          s=s.replace(urgent, urgent+'\nconst MONTHS_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];\n',1)
          marker='\nfunction BulkActions({ rows, auth, busy, onRun, onClear }) {'
          if marker not in s: raise SystemExit('missing BulkActions marker')
          monthly=r'''
function MonthlyOrderTables({ rows, auth, selected, onToggle, onToggleAll, onEdit, onPurchase }) {
  const [openYears, setOpenYears] = useState({});
  const [openMonths, setOpenMonths] = useState({});
  const groups = useMemo(() => {
    const years = new Map();
    for (const row of rows) {
      const raw = row.cancelled_at || row.received_at || row.updated_at || row.date || row.order_date;
      const d = raw ? new Date(raw) : null;
      const valid = d && !Number.isNaN(d.getTime());
      const year = valid ? String(d.getFullYear()) : String(row.date || "").slice(0, 4) || "ไม่ระบุปี";
      const mi = valid ? d.getMonth() : Math.max(0, Number(String(row.date || "").slice(5, 7)) - 1 || 0);
      const key = `${year}-${String(mi + 1).padStart(2, "0")}`;
      if (!years.has(year)) years.set(year, new Map());
      const months = years.get(year);
      if (!months.has(key)) months.set(key, { key, label: MONTHS_TH[mi] || key, rows: [] });
      months.get(key).rows.push(row);
    }
    return Array.from(years.entries())
      .sort((a, b) => Number(b[0]) - Number(a[0]))
      .map(([year, months]) => ({ year, months: Array.from(months.values()).sort((a, b) => b.key.localeCompare(a.key)) }));
  }, [rows]);

  useEffect(() => {
    if (!groups.length) return;
    const y = groups[0];
    const m = y.months[0];
    setOpenYears((prev) => Object.keys(prev).length ? prev : { [y.year]: true });
    if (m) setOpenMonths((prev) => Object.keys(prev).length ? prev : { [m.key]: true });
  }, [groups]);

  if (!groups.length) return <div className="empty">ไม่พบข้อมูล</div>;
  return <div className="history-groups">{groups.map((y) => <section className="history-year" key={y.year}>
    <button className="history-collapse year" onClick={() => setOpenYears((x) => ({ ...x, [y.year]: !x[y.year] }))}><span>{openYears[y.year] ? "▾" : "▸"} ปี {y.year}</span><b>{y.months.reduce((n, m) => n + m.rows.length, 0)} รายการ</b></button>
    {openYears[y.year] && <div className="history-months">{y.months.map((m) => <section className="history-month" key={m.key}>
      <button className="history-collapse month" onClick={() => setOpenMonths((x) => ({ ...x, [m.key]: !x[m.key] }))}><span>{openMonths[m.key] ? "▾" : "▸"} {m.label}</span><b>{m.rows.length} รายการ</b></button>
      {openMonths[m.key] && <OrderTable rows={m.rows} auth={auth} selected={selected} onToggle={onToggle} onToggleAll={onToggleAll} onEdit={onEdit} onPurchase={onPurchase} />}
    </section>)}</div>}
  </section>)}</div>;
}
'''
          s=s.replace(marker,'\n'+monthly+marker,1)
          old='''            <OrderTable\n              rows={rows}\n              auth={auth}\n              selected={selected}\n              onToggle={toggleSelected}\n              onToggleAll={toggleAll}\n              onEdit={(order) => setEditor({ order, project: null })}\n              onPurchase={setPurchase}\n              onUpdate={tab === "updates" ? updateData : null}\n            />'''
          new='''            ["completed", "cancelled"].includes(tab) ? (\n              <MonthlyOrderTables\n                rows={rows}\n                auth={auth}\n                selected={selected}\n                onToggle={toggleSelected}\n                onToggleAll={toggleAll}\n                onEdit={(order) => setEditor({ order, project: null })}\n                onPurchase={setPurchase}\n              />\n            ) : (\n              <OrderTable\n                rows={rows}\n                auth={auth}\n                selected={selected}\n                onToggle={toggleSelected}\n                onToggleAll={toggleAll}\n                onEdit={(order) => setEditor({ order, project: null })}\n                onPurchase={setPurchase}\n                onUpdate={tab === "updates" ? updateData : null}\n              />\n            )'''
          if old not in s: raise SystemExit('missing desktop OrderTable render')
          s=s.replace(old,new,1)
          # Employee selection display: Project owner options name only.
          s=s.replace('{x.name} · {x.employee_code}','{x.name}',1)
          p.write_text(s,encoding='utf-8'); print('grouped completed/cancelled and employee name-only project selection')

          # 5) Audit stamp: employee name only, never employee code.
          p=Path('frontend/src/orderDetailEnhancer.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('const who = cleanText(latest.employee_code) || "ไม่ทราบรหัส";',
                      'const who = cleanText(latest.employee_name) || "ไม่ทราบผู้แก้ไข";',1)
          old='''    const employee = [stamp.employee_code, stamp.employee_name]\n      .filter(Boolean)\n      .join(" · ");'''
          new='''    const employee = cleanText(stamp.employee_name);'''
          if old not in s: raise SystemExit('missing stamp employee block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8'); print('audit stamp shows employee name only')
          PY

          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.jsx frontend/src/mobile/MobileCommon.jsx frontend/src/components/PartDetailModal.jsx frontend/src/mobile/MobileOrders.jsx frontend/src/pages/Orders.jsx frontend/src/orderDetailEnhancer.js
          git commit -m "fix: dashboard inputs and order views"
          git push
