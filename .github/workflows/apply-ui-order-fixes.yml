name: Apply requested dashboard and order UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-order-fixes.yml'
      - '.github/scripts/apply_ui_order_fixes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic patch
        run: python .github/scripts/apply_ui_order_fixes.py
      - name: Commit patched files
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.jsx frontend/src/mobile/MobileCommon.jsx frontend/src/components/PartDetailModal.jsx frontend/src/mobile/MobileOrders.jsx frontend/src/pages/Orders.jsx frontend/src/orderDetailEnhancer.js
          git commit -m "fix: dashboard inputs and order views"
          git push
