name: Build PartsFlow Local Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'local/**'
      - '.github/workflows/build-local-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build local frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          $env:VITE_API_BASE_URL='/api'
          npm run build

      - name: Install local Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r local/requirements-local.txt

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name PartsFlowLocal `
            --paths backend `
            --add-data "frontend/dist;frontend_dist" `
            --add-data "backend/core/migrations/*.txt;core/migrations" `
            --collect-submodules core.migrations `
            --hidden-import whitenoise.middleware `
            --hidden-import corsheaders.middleware `
            backend/local_app.py

      - name: Smoke test EXE and local database
        shell: pwsh
        run: |
          Remove-Item local-smoke-out.txt,local-smoke-err.txt -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$PWD\dist\PartsFlowLocal.exe" -PassThru -RedirectStandardOutput "$PWD\local-smoke-out.txt" -RedirectStandardError "$PWD\local-smoke-err.txt"
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' -TimeoutSec 3
                $check = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health/' -TimeoutSec 5
                Write-Host ("Local check: " + ($check | ConvertTo-Json -Compress))
                if ($r.StatusCode -eq 200 -and $r.Content -match 'root' -and $check.database_vendor -eq 'sqlite' -and $check.migration_0014_applied -eq $true -and $check.migration_0016_applied -eq $true -and $check.rfq_tables_present -eq $true -and $check.imported_order_count -eq 4107) {
                  $ok = $true
                  break
                }
              } catch {
                if (($i % 10) -eq 0) { Write-Host ("Waiting for local app: " + $_.Exception.Message) }
              }
              if ($p.HasExited) { break }
            }
            if (-not $ok) {
              Write-Host '--- PartsFlowLocal stdout ---'
              if (Test-Path local-smoke-out.txt) { Get-Content local-smoke-out.txt }
              Write-Host '--- PartsFlowLocal stderr ---'
              if (Test-Path local-smoke-err.txt) { Get-Content local-smoke-err.txt }
              throw 'PartsFlow Local smoke/database test failed'
            }
            Write-Host 'SMOKE TEST PASSED: SQLite + migrations 0014/0016 + RFQ schema + 4107 imported orders'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\PartsFlowLocal.exe package\PartsFlowLocal.exe
          Copy-Item local\README-LOCAL-TH.txt package\README-LOCAL-TH.txt
          Copy-Item local\Backup-PartsFlow.bat package\Backup-PartsFlow.bat
          Copy-Item local\Restore-PartsFlow.bat package\Restore-PartsFlow.bat
          New-Item -ItemType Directory -Force -Path package\data | Out-Null
          New-Item -ItemType Directory -Force -Path package\backups | Out-Null
          Compress-Archive -Path package\* -DestinationPath PartsFlow-Local-Windows.zip -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PartsFlow-Local-Windows
          path: PartsFlow-Local-Windows.zip
          retention-days: 30

      - name: Publish build result marker
        if: always()
        shell: pwsh
        run: |
          $zipExists = Test-Path PartsFlow-Local-Windows.zip
          $hash = if ($zipExists) { (Get-FileHash PartsFlow-Local-Windows.zip -Algorithm SHA256).Hash.ToLower() } else { '' }
          $size = if ($zipExists) { (Get-Item PartsFlow-Local-Windows.zip).Length } else { 0 }
          $ok = '${{ job.status }}' -eq 'success'
          $status = [ordered]@{
            ok = $ok
            job_status = '${{ job.status }}'
            run_id = '${{ github.run_id }}'
            source_sha = '${{ github.sha }}'
            artifact_name = 'PartsFlow-Local-Windows'
            zip_sha256 = $hash
            zip_size = $size
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          Set-Content -Path local-build-status.json -Value $status -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-build-status.json
          git commit -m "build: record PartsFlow Local Windows result" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nothing to commit, skipping push."
            exit 0
          }
          # The build can take several minutes, so main may have moved on
          # while this job was running. Rebase onto the latest main before
          # pushing so a concurrent push elsewhere doesn't reject this one.
          $pushed = $false
          for ($i = 0; $i -lt 3; $i++) {
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              Write-Host "Rebase conflict on attempt $($i+1), retrying..."
              Start-Sleep -Seconds 5
              continue
            }
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push attempt $($i+1) failed, retrying..."
            Start-Sleep -Seconds 5
          }
          if (-not $pushed) {
            # This marker file is informational only - never fail an
            # otherwise-successful EXE build over it.
            Write-Host "::warning::Could not push local-build-status.json after retries - leaving it for a future run."
          }
