name: Repair production Orders runtime

on:
  push:
    paths:
      - '.github/workflows/repair-orders-runtime.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://partsflow-production.up.railway.app/api/production-check/'
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/check.json -w '%{http_code}' --max-time 15 "$URL" || true)
            echo "attempt=$i http=$code body=$(cat /tmp/check.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo 'Production API did not become ready'
          exit 1

      - name: Snapshot before repair
        run: |
          curl -fsS --max-time 30 'https://partsflow-production.up.railway.app/api/production-check/' | tee /tmp/before.json
          echo

      - name: Run migration 0014 in production runtime DB
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/repair.json -w '%{http_code}' --max-time 240 \
            -X POST \
            'https://partsflow-production.up.railway.app/api/production-repair/' || true)
          echo "repair_http=$code"
          cat /tmp/repair.json
          echo
          test "$code" = "200"

      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://partsflow-production.up.railway.app/api/production-check/' | tee /tmp/after.json
          echo
          python - <<'PY'
          import json
          p=json.load(open('/tmp/after.json'))
          assert p.get('migration_0014_applied') is True, p
          assert p.get('imported_order_count') == 4107, p
          assert p.get('order_count') == 4107, p
          print('VERIFIED: runtime DB has migration 0014 and 4107 imported orders')
          PY
