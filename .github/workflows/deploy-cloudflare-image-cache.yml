name: Deploy Cloudflare image cache Worker

on:
  workflow_dispatch:
    inputs:
      confirm_workers_free:
        description: "I have verified this account uses Workers Free (not Workers Paid) and authorize deploying the optional image-cache Worker."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-image-cache-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_workers_free == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/image-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy image cache Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.161.0 deploy --config wrangler.jsonc
