name: V73 Dashboard Patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'partsflow-v7.3-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partsflow-v7.3-release
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/Dashboard.jsx');s=p.read_text()
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('missing pattern')
              s=s.replace(a,b,1)
          rep('import PartDetailModal from "../components/PartDetailModal";','import PartDetailModal from "../components/PartDetailModal";\nimport BarcodeScannerModal from "../components/BarcodeScannerModal";')
          rep('  const [detail,setDetail]=useState(null);','  const [detail,setDetail]=useState(null);\n  const [scannerOpen,setScannerOpen]=useState(false);')
          rep('''        <input
          className="search-input"
          value={q}
          onChange={e=>setQ(e.target.value)}
          placeholder="ค้นหา Location / Item ID / Part Name / Detail / Maker..."
        />''','''        <div style={{display:"flex",alignItems:"center",gap:"6px",flex:"1 1 360px",minWidth:"260px",maxWidth:"520px"}}><input className="search-input" style={{maxWidth:"none",minWidth:0,width:"100%"}} value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหา Location / Item ID / Part Name / Detail / Maker..."/><button type="button" className="btn ghost" title="สแกน Barcode / QR Code" aria-label="สแกน Barcode หรือ QR Code" onClick={()=>setScannerOpen(true)} style={{fontSize:"18px",padding:"7px 11px",flex:"0 0 auto"}}>⌗</button></div>''')
          rep('                    <th>Action</th>','                    {partView==="active"&&<th>Action</th>}')
          rep('                    <tr key={p.id}>','                    <tr key={p.id} onClick={()=>setDetail(p)} onKeyDown={e=>{if(e.target!==e.currentTarget)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();setDetail(p)}}} role="button" tabIndex={0} title="คลิกเพื่อดูรายละเอียดอะไหล่" style={{cursor:"pointer"}}>')
          rep('                      <td><span className={`stock-state ${p.stock_status||"normal"}`}>{p.stock_status_label||"normal"}</span></td>','                      <td>{partView==="inactive"?<span className="status muted">Inactive</span>:<span className={`stock-state ${p.stock_status||"normal"}`}>{p.stock_status_label||"normal"}</span>}</td>')
          a='''                      <td>
                        <div className="row-actions">
                          <button className="mini primary" onClick={()=>setDetail(p)}>รายละเอียด</button>
                          {auth.can("can_edit_parts")&&
                            <button className="mini" onClick={()=>openEditPart(p)}>แก้ไข</button>}
                          {auth.can("can_adjust_stock")&&
                            <button className="mini" onClick={()=>setAdjust(p)}>ปรับยอด</button>}
                          {auth.can("can_issue_stock")&&
                            <button className="mini danger" onClick={()=>openStock("issue",p)}>เบิก</button>}
                          {auth.can("can_receive_stock")&&
                            <button className="mini success" onClick={()=>openStock("receive",p)}>รับเข้า</button>}
                        </div>
                      </td>'''
          b='''                      {partView==="active"&&<td onClick={e=>e.stopPropagation()}><div className="row-actions">{auth.can("can_edit_parts")&&<button className="mini" onClick={e=>{e.stopPropagation();openEditPart(p)}}>แก้ไข</button>}{auth.can("can_adjust_stock")&&<button className="mini" onClick={e=>{e.stopPropagation();setAdjust(p)}}>ปรับยอด</button>}{auth.can("can_issue_stock")&&<button className="mini danger" onClick={e=>{e.stopPropagation();openStock("issue",p)}}>เบิก</button>}{auth.can("can_receive_stock")&&<button className="mini success" onClick={e=>{e.stopPropagation();openStock("receive",p)}}>รับเข้า</button>}</div></td>}''';rep(a,b)
          rep('''    {detail&&
      <PartDetailModal''','''    {scannerOpen&&<BarcodeScannerModal onClose={()=>setScannerOpen(false)} onDetected={value=>{setQ(value);setDebouncedQ(value);setPage(1);setScannerOpen(false)}}/>}
    {detail&&
      <PartDetailModal''')
          p.write_text(s)
          PY
          git config user.name "ChatGPT PartsFlow"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.jsx
          git rm .github/workflows/v73-dashboard-patch.yml
          git commit -m "feat: V7.3 dashboard scanner and row interactions"
          git push origin HEAD:partsflow-v7.3-release
