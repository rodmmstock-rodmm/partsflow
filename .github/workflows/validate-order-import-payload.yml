name: Validate order import payload

on:
  push:
    paths:
      - '.github/workflows/validate-order-import-payload.yml'
      - 'backend/core/migrations/order_import_2026_payload_*.txt'
      - 'backend/core/migrations/0014_import_excel_orders_2026.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chunked payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          d=Path('backend/core/migrations')
          first=d/'order_import_2026_payload_01a.txt'
          s=first.read_text(encoding='utf-8').strip()
          fix=(d/'order_import_2026_payload_01a_fix_0500_0999.txt').read_text(encoding='utf-8').strip()
          print('fix',len(fix),hashlib.sha256(fix.encode('ascii')).hexdigest())
          assert len(fix)==500
          assert hashlib.sha256(fix.encode('ascii')).hexdigest()=='c74370eb35cfa968388771a2ac67c789ef0d88b674f60e7bf56bb004e047733e'
          first_corrected=s[:500]+fix+s[1000:]
          print('01a-corrected',len(first_corrected),hashlib.sha256(first_corrected.encode('ascii')).hexdigest())
          assert hashlib.sha256(first_corrected.encode('ascii')).hexdigest()=='7e73f1cef4d321bd412e7b0790c4256897c15821ef53448e1f4b41d088b8694c'
          parts=[first_corrected]
          for name in ['order_import_2026_payload_01b.txt','order_import_2026_payload_01c.txt','order_import_2026_payload_01d.txt'] + [f'order_import_2026_payload_{i:02d}.txt' for i in range(2,13)]:
              value=(d/name).read_text(encoding='utf-8').strip()
              print(name,len(value),hashlib.sha256(value.encode('ascii')).hexdigest())
              parts.append(value)
          encoded=''.join(parts)
          digest=hashlib.sha256(encoded.encode('ascii')).hexdigest()
          print('encoded_len',len(encoded))
          print('sha256',digest)
          assert len(encoded)==189160
          assert digest=='31468142039ed7466b9062dd155b40aa5f70f198effb49972bc1af9e370c9cbb'
          rows=json.loads(lzma.decompress(base64.b64decode(encoded)).decode('utf-8'))
          print('rows',len(rows),'first',rows[0]['sheet'],rows[0]['row'],'last',rows[-1]['sheet'],rows[-1]['row'])
          assert len(rows)==4107
          PY
