name: Apply PartsFlow Web Order UI Patch

on:
  push:
    paths:
      - "scripts/apply_web_order_ui_20260831.py"
      - ".github/workflows/apply-web-order-ui-20260831.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested web changes
        run: python scripts/apply_web_order_ui_20260831.py

      - name: Verify backend Python syntax
        run: |
          python -m py_compile \
            backend/core/models.py \
            backend/core/auth_api.py \
            backend/core/order_api.py \
            backend/core/order_audit_api.py \
            backend/core/role_api.py \
            backend/core/migrations/0015_order_visibility_and_date_permissions.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/pages/Dashboard.jsx \
            frontend/src/pages/Orders.jsx \
            frontend/src/pages/RoleSettings.jsx \
            backend/core/models.py \
            backend/core/auth_api.py \
            backend/core/order_api.py \
            backend/core/order_audit_api.py \
            backend/core/migrations/0015_order_visibility_and_date_permissions.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: refine order views and role permissions"
          git push origin HEAD:main
