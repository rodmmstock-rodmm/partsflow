name: PartsFlow PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/partsflow-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and Tooling regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DATABASE_URL: "sqlite:///db.sqlite3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run

      - name: Run Tooling regression tests
        run: python manage.py test core.tests.test_tooling_inventory --verbosity 2

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Python for backend and browser tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and browser dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Migrate and seed isolated SQLite database
        run: |
          env DEBUG=1 DJANGO_SECRET_KEY=ci-only-not-a-production-secret DATABASE_URL=sqlite:///e2e.sqlite3 CORS_ALLOWED_ORIGINS=http://127.0.0.1:4173 ALLOWED_HOSTS=127.0.0.1,localhost python ../backend/manage.py migrate --noinput
          env DEBUG=1 DJANGO_SECRET_KEY=ci-only-not-a-production-secret DATABASE_URL=sqlite:///e2e.sqlite3 CORS_ALLOWED_ORIGINS=http://127.0.0.1:4173 ALLOWED_HOSTS=127.0.0.1,localhost python ../scripts/seed_tooling_e2e.py

      - name: Build frontend for isolated end-to-end tests
        run: VITE_API_BASE_URL=http://127.0.0.1:8000/api npm run build

      - name: Run desktop and mobile Tooling end-to-end tests
        run: |
          export DEBUG=1
          export DJANGO_SECRET_KEY=ci-only-not-a-production-secret
          export DATABASE_URL=sqlite:///e2e.sqlite3
          export CORS_ALLOWED_ORIGINS=http://127.0.0.1:4173
          export ALLOWED_HOSTS=127.0.0.1,localhost
          python ../backend/manage.py runserver 127.0.0.1:8000 > /tmp/partsflow-backend.log 2>&1 &
          BACKEND_PID=$!
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/partsflow-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$BACKEND_PID" "$PREVIEW_PID" 2>/dev/null || true' EXIT

          backend_ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ >/dev/null; then
              backend_ready=1
              break
            fi
            sleep 1
          done
          if [ "$backend_ready" -ne 1 ]; then
            cat /tmp/partsflow-backend.log
            exit 1
          fi

          preview_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/login >/dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [ "$preview_ready" -ne 1 ]; then
            cat /tmp/partsflow-preview.log
            exit 1
          fi

          python ../scripts/test_tooling_ui.py
