name: PartsFlow PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/test_tooling_ui.py"
      - ".github/workflows/partsflow-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and Tooling regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DATABASE_URL: "sqlite:///db.sqlite3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run

      - name: Run Tooling regression tests
        run: python manage.py test core.tests.test_tooling_inventory --verbosity 2

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for isolated UI tests
        run: VITE_API_BASE_URL=/api npm run build

      - name: Set up Python for browser tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run desktop and mobile Tooling UI smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/partsflow-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/login >/dev/null || {
            cat /tmp/partsflow-preview.log
            exit 1
          }
          python ../scripts/test_tooling_ui.py
