[build]
builder = "RAILPACK"

[deploy]
# Apply schema/data migrations to the persistent PostgreSQL database, then
# refuse promotion unless the approved Excel import is present in that same DB.
preDeployCommand = "python manage.py migrate --noinput && python manage.py shell -c \"from core.models import OrderRecord; n=OrderRecord.objects.filter(legacy_source='EXCEL_ORDER_2026', is_deleted=False).count(); assert n == 4107, f'Expected 4107 imported Orders, got {n}'\""
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
