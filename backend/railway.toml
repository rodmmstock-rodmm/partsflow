[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = ["python manage.py shell -c \"from django.db import connection; assert connection.vendor == 'postgresql', f'Expected PostgreSQL, got {connection.vendor}'\""]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
