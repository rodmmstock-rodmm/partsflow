[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = ["python manage.py shell -c \"from core.models import OrderRecord; from core.order_api import order_json, order_queryset; q=OrderRecord.objects.filter(legacy_source='EXCEL_ORDER_2026', is_deleted=False, lifecycle_status='ACTIVE').exclude(status='Complete Order'); assert q.exists(), 'No displayable ACTIVE imported Orders'; o=order_queryset().filter(pk=q.values_list('pk', flat=True).first()).first(); d=order_json(o); assert d.get('id') and d.get('order_number'), 'order_json failed'\""]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
